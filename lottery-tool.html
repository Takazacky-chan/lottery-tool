<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 活动抽签工具（云同步）</title>
    <!-- 引入 Firebase SDK v9 (兼容模式) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* 样式与之前完全相同（省略，完整保留） */
        /* ===== 全局重置 & 基础 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif; background:linear-gradient(135deg,#e0e7ff 0%,#f0e6ff 100%); min-height:100vh; padding:24px 16px; display:flex; justify-content:center; align-items:flex-start; }
        .app { max-width:1200px; width:100%; background:rgba(255,255,255,0.70); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:40px; padding:32px 28px; box-shadow:0 25px 60px rgba(102,126,234,0.25); border:1px solid rgba(255,255,255,0.50); }
        .header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-bottom:28px; gap:16px; }
        .header-left { display:flex; align-items:center; gap:14px; }
        .header-left .icon { font-size:36px; }
        .header-left h1 { font-size:28px; font-weight:700; background:linear-gradient(135deg,#4f46e5,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .header-left .sub { font-size:14px; color:#6b7280; background:rgba(255,255,255,0.6); padding:4px 14px; border-radius:20px; font-weight:500; -webkit-text-fill-color:#6b7280; margin-left:6px; }
        .header-stats { display:flex; flex-wrap:wrap; gap:12px 20px; background:rgba(255,255,255,0.5); padding:10px 22px; border-radius:60px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.6); }
        .header-stats .stat-item { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:500; color:#1f2937; }
        .header-stats .stat-item .num { font-weight:700; font-size:18px; color:#4f46e5; min-width:20px; text-align:center; }
        .header-stats .stat-item .num.danger { color:#dc2626; }
        .header-stats .stat-item .num.success { color:#16a34a; }
        .header-stats .stat-item .num.warning { color:#d97706; }
        .stat-divider { width:1px; height:28px; background:rgba(0,0,0,0.10); }
        .progress-wrap { background:rgba(255,255,255,0.5); border-radius:60px; height:8px; margin-bottom:28px; overflow:hidden; border:1px solid rgba(255,255,255,0.4); }
        .progress-wrap .bar { height:100%; width:0%; border-radius:60px; background:linear-gradient(90deg,#818cf8,#7c3aed,#a855f7); transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 0 20px rgba(124,58,237,0.25); }
        .progress-wrap .bar.full { background:linear-gradient(90deg,#34d399,#16a34a); }
        .tabs { display:flex; gap:6px; margin-bottom:28px; background:rgba(255,255,255,0.4); padding:6px; border-radius:60px; border:1px solid rgba(255,255,255,0.5); flex-wrap:wrap; }
        .tabs .tab-btn { flex:1; min-width:90px; padding:10px 20px; border:none; border-radius:40px; font-size:15px; font-weight:600; color:#6b7280; background:transparent; cursor:pointer; transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; gap:8px; }
        .tabs .tab-btn:hover { color:#4f46e5; background:rgba(255,255,255,0.3); }
        .tabs .tab-btn.active { background:#4f46e5; color:#fff; box-shadow:0 8px 24px rgba(79,70,229,0.30); }
        .tab-content { display:none; animation:fadeUp 0.4s ease; }
        .tab-content.active { display:block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .draw-area { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
        @media (max-width:820px) { .draw-area { grid-template-columns:1fr; gap:24px; } }
        .draw-card { background:rgba(255,255,255,0.60); border-radius:28px; padding:28px 24px; border:1px solid rgba(255,255,255,0.7); backdrop-filter:blur(4px); box-shadow:0 8px 32px rgba(0,0,0,0.04); }
        .draw-card .card-title { font-size:18px; font-weight:700; color:#1f2937; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .draw-card .card-title .emoji { font-size:22px; }
        .input-group { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
        .input-group input { flex:1; min-width:160px; padding:14px 20px; border:2px solid rgba(229,231,235,0.8); border-radius:60px; font-size:16px; font-weight:500; color:#1f2937; background:rgba(255,255,255,0.7); transition:all 0.3s ease; outline:none; }
        .input-group input:focus { border-color:#818cf8; box-shadow:0 0 0 4px rgba(129,140,248,0.15); background:#fff; }
        .input-group input::placeholder { color:#9ca3af; font-weight:400; }
        .input-group input:disabled { opacity:0.6; cursor:not-allowed; }
        .btn { padding:14px 32px; border:none; border-radius:60px; font-size:16px; font-weight:700; color:#fff; background:linear-gradient(135deg,#818cf8,#7c3aed); cursor:pointer; transition:all 0.3s ease; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; box-shadow:0 8px 24px rgba(124,58,237,0.25); }
        .btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(124,58,237,0.35); }
        .btn:active { transform:scale(0.96); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
        .btn-success { background:linear-gradient(135deg,#34d399,#16a34a); box-shadow:0 8px 24px rgba(22,163,74,0.25); }
        .btn-success:hover { box-shadow:0 12px 32px rgba(22,163,74,0.35); }
        .btn-danger { background:linear-gradient(135deg,#f87171,#dc2626); box-shadow:0 8px 24px rgba(220,38,38,0.20); }
        .btn-danger:hover { box-shadow:0 12px 32px rgba(220,38,38,0.30); }
        .btn-outline { background:transparent; color:#4f46e5; border:2px solid #4f46e5; box-shadow:none; }
        .btn-outline:hover { background:#4f46e5; color:#fff; box-shadow:0 8px 24px rgba(79,70,229,0.25); }
        .btn-sm { padding:8px 18px; font-size:13px; }
        .result-box { margin-top:20px; padding:20px 24px; border-radius:20px; background:rgba(255,255,255,0.5); border:2px dashed rgba(203,213,225,0.6); min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:all 0.4s ease; text-align:center; }
        .result-box .placeholder { color:#9ca3af; font-size:15px; font-weight:500; }
        .result-box .result-name { font-size:28px; font-weight:700; color:#1f2937; }
        .result-box .result-decision { font-size:48px; font-weight:800; margin-top:6px; letter-spacing:4px; }
        .result-box .result-decision.go { color:#16a34a; }
        .result-box .result-decision.no { color:#dc2626; }
        .result-box .result-sub { font-size:14px; color:#6b7280; margin-top:6px; }
        .result-box.has-result { border-style:solid; border-color:rgba(203,213,225,0.8); background:rgba(255,255,255,0.7); }
        .result-box .draw-animation { font-size:52px; animation:spin 0.8s ease-in-out; }
        @keyframes spin { 0% { transform:rotate(0deg) scale(0.8); opacity:0.3; } 50% { transform:rotate(180deg) scale(1.2); opacity:1; } 100% { transform:rotate(360deg) scale(1); opacity:1; } }
        .message { padding:12px 18px; border-radius:16px; font-weight:500; font-size:14px; margin-top:14px; display:none; align-items:center; gap:10px; }
        .message.show { display:flex; }
        .message.info { background:rgba(59,130,246,0.10); color:#2563eb; border:1px solid rgba(59,130,246,0.15); }
        .message.success { background:rgba(22,163,74,0.10); color:#16a34a; border:1px solid rgba(22,163,74,0.15); }
        .message.error { background:rgba(220,38,38,0.10); color:#dc2626; border:1px solid rgba(220,38,38,0.15); }
        .message.warning { background:rgba(217,119,6,0.10); color:#d97706; border:1px solid rgba(217,119,6,0.15); }
        .result-list-wrap { max-height:460px; overflow-y:auto; padding-right:4px; }
        .result-list-wrap::-webkit-scrollbar { width:5px; }
        .result-list-wrap::-webkit-scrollbar-track { background:rgba(0,0,0,0.04); border-radius:10px; }
        .result-list-wrap::-webkit-scrollbar-thumb { background:rgba(124,58,237,0.25); border-radius:10px; }
        .result-item { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-radius:16px; background:rgba(255,255,255,0.4); margin-bottom:8px; transition:all 0.2s ease; border:1px solid transparent; }
        .result-item:hover { background:rgba(255,255,255,0.7); border-color:rgba(203,213,225,0.3); }
        .result-item .name { font-weight:600; color:#1f2937; font-size:16px; }
        .result-item .tag { padding:4px 16px; border-radius:40px; font-weight:700; font-size:14px; letter-spacing:1px; }
        .result-item .tag.go { background:rgba(22,163,74,0.12); color:#16a34a; }
        .result-item .tag.no { background:rgba(220,38,38,0.10); color:#dc2626; }
        .result-item .tag.waiting { background:rgba(156,163,175,0.12); color:#6b7280; }
        .result-empty { text-align:center; padding:40px 20px; color:#9ca3af; }
        .result-empty .big-emoji { font-size:48px; display:block; margin-bottom:12px; }
        .manage-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
        @media (max-width:700px) { .manage-grid { grid-template-columns:1fr; } }
        .manage-card { background:rgba(255,255,255,0.50); border-radius:24px; padding:24px 22px; border:1px solid rgba(255,255,255,0.6); backdrop-filter:blur(4px); }
        .manage-card .card-title { font-size:17px; font-weight:700; color:#1f2937; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
        .name-tag-list { display:flex; flex-wrap:wrap; gap:8px; max-height:280px; overflow-y:auto; padding:4px 2px; }
        .name-tag-list::-webkit-scrollbar { width:4px; }
        .name-tag-list::-webkit-scrollbar-thumb { background:rgba(124,58,237,0.20); border-radius:10px; }
        .name-tag { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.7); padding:6px 14px 6px 18px; border-radius:40px; font-weight:500; font-size:14px; color:#1f2937; border:1px solid rgba(203,213,225,0.3); transition:all 0.2s ease; }
        .name-tag .del { cursor:pointer; color:#9ca3af; font-size:16px; line-height:1; transition:color 0.2s; background:none; border:none; padding:0 2px; }
        .name-tag .del:hover { color:#dc2626; }
        .name-tag .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
        .name-tag .status-dot.go { background:#16a34a; }
        .name-tag .status-dot.no { background:#dc2626; }
        .name-tag .status-dot.waiting { background:#d1d5db; }
        .count-hint { font-size:14px; color:#6b7280; margin-top:12px; font-weight:500; }
        .count-hint strong { color:#4f46e5; }
        .filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
        .filter-bar .filter-btn { padding:6px 18px; border:2px solid transparent; border-radius:40px; font-size:13px; font-weight:600; background:rgba(255,255,255,0.4); color:#6b7280; cursor:pointer; transition:all 0.2s ease; }
        .filter-bar .filter-btn:hover { background:rgba(255,255,255,0.7); }
        .filter-bar .filter-btn.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
        @media (max-width:600px) { .app { padding:20px 14px; border-radius:28px; } .header-left h1 { font-size:22px; } .header-left .sub { font-size:12px; padding:2px 12px; } .header-stats { padding:8px 16px; gap:8px 14px; } .header-stats .stat-item { font-size:13px; } .header-stats .stat-item .num { font-size:16px; } .stat-divider { display:none; } .tabs .tab-btn { font-size:13px; padding:8px 14px; min-width:60px; } .draw-card { padding:20px 16px; } .result-box .result-decision { font-size:36px; } .result-box .result-name { font-size:22px; } .btn { padding:12px 20px; font-size:14px; } .input-group input { padding:12px 16px; font-size:14px; } .manage-card { padding:18px 16px; } }
        .celebrate { animation:celebratePop 0.6s ease; }
        @keyframes celebratePop { 0% { transform:scale(0.8); opacity:0; } 50% { transform:scale(1.08); } 100% { transform:scale(1); opacity:1; } }
        .confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; overflow:hidden; }
        .confetti { position:absolute; width:10px; height:10px; border-radius:2px; opacity:0; animation:confettiFall linear forwards; }
        @keyframes confettiFall { 0% { transform:translateY(-20px) rotate(0deg); opacity:1; } 100% { transform:translateY(110vh) rotate(720deg); opacity:0; } }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(31,41,55,0.92); backdrop-filter:blur(12px); color:#fff; padding:14px 28px; border-radius:60px; font-weight:600; font-size:15px; box-shadow:0 12px 40px rgba(0,0,0,0.20); opacity:0; transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none; z-index:999; border:1px solid rgba(255,255,255,0.10); }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .sync-status { font-size:13px; color:#6b7280; margin-left:12px; display:inline-flex; align-items:center; gap:4px; }
        .sync-status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#34d399; animation:pulse 1.5s infinite; }
        .sync-status .dot.off { background:#f87171; animation:none; }
        @keyframes pulse { 0% { opacity:0.3; } 50% { opacity:1; } 100% { opacity:0.3; } }
    </style>
</head>
<body>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-left">
                <span class="icon">🎯</span>
                <h1>活动抽签</h1>
                <span class="sub">25选11</span>
                <span class="sync-status" id="syncStatus">
                    <span class="dot" id="syncDot"></span>
                    <span id="syncLabel">同步中</span>
                </span>
            </div>
            <div class="header-stats" id="headerStats">
                <span class="stat-item">👥 总 <span class="num" id="totalNum">0</span></span>
                <span class="stat-divider"></span>
                <span class="stat-item">✅ 已抽 <span class="num" id="drawnNum">0</span></span>
                <span class="stat-divider"></span>
                <span class="stat-item">🎯 已去 <span class="num success" id="goNum">0</span>/<span id="goTotal">11</span></span>
                <span class="stat-divider"></span>
                <span class="stat-item">⏳ 剩余 <span class="num warning" id="remainNum">11</span></span>
            </div>
        </header>

        <!-- 进度条 -->
        <div class="progress-wrap">
            <div class="bar" id="progressBar"></div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabHeaders">
            <button class="tab-btn active" data-tab="draw">🎲 抽签</button>
            <button class="tab-btn" data-tab="manage">📋 名单管理</button>
            <button class="tab-btn" data-tab="results">📊 结果总览</button>
        </div>

        <!-- ===== Tab: 抽签 ===== -->
        <div class="tab-content active" id="tabDraw">
            <div class="draw-area">
                <div class="draw-card">
                    <div class="card-title"><span class="emoji">✍️</span> 输入姓名抽签</div>
                    <div class="input-group">
                        <input type="text" id="drawInput" placeholder="请输入你的名字..." autocomplete="off" />
                        <button class="btn" id="drawBtn">🎲 抽签</button>
                    </div>
                    <div class="message" id="drawMessage"></div>
                    <div class="result-box" id="resultBox">
                        <span class="placeholder">👆 输入名字，点击抽签</span>
                    </div>
                    <div style="margin-top:16px;font-size:13px;color:#9ca3af;background:rgba(255,255,255,0.3);padding:10px 16px;border-radius:16px;border:1px dashed rgba(203,213,225,0.4);">
                        💡 共 <strong id="listCountDisplay">0</strong> 人，已抽 <strong id="drawnCountDisplay">0</strong> 人，剩余 <strong id="remainCountDisplay">0</strong> 人未抽
                    </div>
                </div>
                <div class="draw-card">
                    <div class="card-title"><span class="emoji">📋</span> 已抽签名单 <span style="font-size:14px;font-weight:400;color:#9ca3af;" id="resultCountLabel">(0人)</span></div>
                    <div class="result-list-wrap" id="resultListWrap">
                        <div class="result-empty" id="resultEmpty">
                            <span class="big-emoji">🕊️</span>
                            还没有人抽签，快来第一个吧！
                        </div>
                        <div id="resultList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Tab: 名单管理 ===== -->
        <div class="tab-content" id="tabManage">
            <div class="manage-grid">
                <div class="manage-card">
                    <div class="card-title">📝 当前名单 <span style="font-size:14px;font-weight:400;color:#9ca3af;" id="manageCountLabel">(0/25)</span></div>
                    <div class="name-tag-list" id="nameTagList">
                        <div style="color:#9ca3af;padding:20px 0;text-align:center;width:100%;">名单为空，请添加或快速填充</div>
                    </div>
                    <div class="count-hint">已录入 <strong id="manageCountNum">0</strong> 人，最多 <strong>25</strong> 人</div>
                </div>
                <div class="manage-card">
                    <div class="card-title">➕ 添加成员</div>
                    <div class="input-group">
                        <input type="text" id="addNameInput" placeholder="输入姓名..." autocomplete="off" />
                        <button class="btn" id="addNameBtn">添加</button>
                    </div>
                    <div class="message" id="manageMessage"></div>
                    <div style="margin-top:16px;">
                        <button class="btn btn-sm btn-success" id="quickFillBtn">⚡ 快速填充示例 (25人)</button>
                        <button class="btn btn-sm btn-danger" id="clearAllBtn" style="margin-left:8px;">🗑️ 清空名单</button>
                    </div>
                    <div style="margin-top:12px;font-size:13px;color:#9ca3af;">
                        💡 可逐个添加，也可一键填充示例数据
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Tab: 结果总览 ===== -->
        <div class="tab-content" id="tabResults">
            <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px;">
                <div style="background:rgba(255,255,255,0.5);padding:12px 24px;border-radius:60px;border:1px solid rgba(255,255,255,0.6);">
                    <span style="font-weight:500;color:#6b7280;">总人数</span>
                    <span style="font-weight:700;font-size:20px;color:#4f46e5;margin-left:8px;" id="overviewTotal">0</span>
                </div>
                <div style="background:rgba(255,255,255,0.5);padding:12px 24px;border-radius:60px;border:1px solid rgba(255,255,255,0.6);">
                    <span style="font-weight:500;color:#6b7280;">✅ 已抽</span>
                    <span style="font-weight:700;font-size:20px;color:#4f46e5;margin-left:8px;" id="overviewDrawn">0</span>
                </div>
                <div style="background:rgba(22,163,74,0.10);padding:12px 24px;border-radius:60px;border:1px solid rgba(22,163,74,0.15);">
                    <span style="font-weight:500;color:#16a34a;">🎯 去</span>
                    <span style="font-weight:700;font-size:20px;color:#16a34a;margin-left:8px;" id="overviewGo">0</span>
                </div>
                <div style="background:rgba(220,38,38,0.10);padding:12px 24px;border-radius:60px;border:1px solid rgba(220,38,38,0.15);">
                    <span style="font-weight:500;color:#dc2626;">🚫 不去</span>
                    <span style="font-weight:700;font-size:20px;color:#dc2626;margin-left:8px;" id="overviewNo">0</span>
                </div>
                <div style="background:rgba(156,163,175,0.10);padding:12px 24px;border-radius:60px;border:1px solid rgba(156,163,175,0.15);">
                    <span style="font-weight:500;color:#6b7280;">⏳ 未抽</span>
                    <span style="font-weight:700;font-size:20px;color:#6b7280;margin-left:8px;" id="overviewRemain">0</span>
                </div>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="go">🎯 去</button>
                <button class="filter-btn" data-filter="no">🚫 不去</button>
                <button class="filter-btn" data-filter="waiting">⏳ 未抽</button>
            </div>
            <div style="background:rgba(255,255,255,0.40);border-radius:24px;padding:20px;border:1px solid rgba(255,255,255,0.5);max-height:420px;overflow-y:auto;" id="overviewListWrap">
                <div id="overviewList"></div>
            </div>
        </div>
    </div>

    <!-- ===== 彩蛋容器 ===== -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG (请替换为您的配置)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD...",          // 替换
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:..."
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        //  DATA LAYER (与 Firebase 实时同步)
        // ============================================================
        const STORAGE_KEY = 'lottery_draw_data'; // 保留用于降级
        const TOTAL_SLOTS = 11;
        const MAX_PEOPLE = 25;

        let data = {
            participants: [],
            results: {}
        };

        // 是否已从云端加载完成
        let isInitialized = false;

        // 引用 Firebase 节点
        const dbRef = db.ref('lotteryData');

        // 监听远程数据变化
        dbRef.on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                data.participants = val.participants || [];
                data.results = val.results || {};
                // 确保不超过限制
                if (data.participants.length > MAX_PEOPLE) {
                    data.participants = data.participants.slice(0, MAX_PEOPLE);
                    // 清理无效结果
                    const valid = {};
                    data.participants.forEach(name => { if (data.results[name]) valid[name] = data.results[name]; });
                    data.results = valid;
                    saveToFirebase(); // 修正
                }
                isInitialized = true;
                renderAll();
                updateSyncStatus(true);
            } else {
                // 云端无数据，将本地数据推上去（如果本地有数据）
                if (data.participants.length > 0) {
                    saveToFirebase();
                } else {
                    // 首次使用，填充示例
                    const demo = ['张伟', '李娜', '王芳', '刘洋', '陈静', '杨帆', '赵敏', '黄海', '周洁', '吴强', '徐丽', '孙阳', '马丁', '朱婷',
                        '胡军', '郭靖', '林黛', '何云', '高远', '罗浩', '郑爽', '梁宇', '谢安', '韩冰', '唐欣'
                    ];
                    data.participants = demo;
                    data.results = {};
                    saveToFirebase();
                    renderAll();
                }
            }
        }, (error) => {
            console.error('Firebase 同步错误:', error);
            updateSyncStatus(false);
            // 尝试从 localStorage 加载作为降级
            loadLocalData();
            renderAll();
        });

        // 保存数据到 Firebase
        function saveToFirebase() {
            dbRef.set({
                participants: data.participants,
                results: data.results
            }).then(() => {
                updateSyncStatus(true);
            }).catch((err) => {
                console.error('保存失败:', err);
                updateSyncStatus(false);
            });
        }

        // 本地降级 (可选)
        function loadLocalData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    data.participants = parsed.participants || [];
                    data.results = parsed.results || {};
                }
            } catch (e) { /* ignore */ }
        }

        // 更新同步状态指示
        function updateSyncStatus(ok) {
            const dot = document.getElementById('syncDot');
            const label = document.getElementById('syncLabel');
            if (ok) {
                dot.className = 'dot';
                label.textContent = '已同步';
            } else {
                dot.className = 'dot off';
                label.textContent = '离线模式';
            }
        }

        // ============================================================
        //  HELPERS (与之前相同)
        // ============================================================
        function getGoCount() {
            let count = 0;
            data.participants.forEach(name => { if (data.results[name] === 'go') count++; });
            return count;
        }

        function getNoCount() {
            let count = 0;
            data.participants.forEach(name => { if (data.results[name] === 'no') count++; });
            return count;
        }

        function getDrawnCount() {
            let count = 0;
            data.participants.forEach(name => { if (data.results[name]) count++; });
            return count;
        }

        function getRemainSlots() {
            return TOTAL_SLOTS - getGoCount();
        }

        function getUndrawnList() {
            return data.participants.filter(name => !data.results[name]);
        }

        function isFull() {
            return getGoCount() >= TOTAL_SLOTS;
        }

        function isAllDrawn() {
            return getDrawnCount() >= data.participants.length && data.participants.length > 0;
        }

        function drawDecision(name) {
            if (data.results[name]) return data.results[name];
            if (isFull()) return 'no';
            const remainSlots = getRemainSlots();
            const undrawn = getUndrawnList();
            const totalUndrawn = undrawn.length;
            if (totalUndrawn === 0) return 'no';
            const prob = remainSlots / totalUndrawn;
            const rand = Math.random();
            const decision = rand < prob ? 'go' : 'no';
            if (decision === 'go' && isFull()) return 'no';
            return decision;
        }

        // ============================================================
        //  RENDER (完全复用之前的渲染函数)
        // ============================================================
        function renderAll() {
            renderStats();
            renderProgress();
            renderResultList();
            renderNameTags();
            renderOverview();
            renderDrawInfo();
            updateButtons();
        }

        function renderStats() {
            const total = data.participants.length;
            const drawn = getDrawnCount();
            const go = getGoCount();
            const remain = getRemainSlots();
            document.getElementById('totalNum').textContent = total;
            document.getElementById('drawnNum').textContent = drawn;
            document.getElementById('goNum').textContent = go;
            document.getElementById('goTotal').textContent = TOTAL_SLOTS;
            document.getElementById('remainNum').textContent = Math.max(0, remain);
        }

        function renderProgress() {
            const go = getGoCount();
            const pct = Math.min(100, (go / TOTAL_SLOTS) * 100);
            const bar = document.getElementById('progressBar');
            bar.style.width = pct + '%';
            if (go >= TOTAL_SLOTS) bar.classList.add('full');
            else bar.classList.remove('full');
        }

        function renderResultList() {
            const wrap = document.getElementById('resultList');
            const empty = document.getElementById('resultEmpty');
            const label = document.getElementById('resultCountLabel');
            const drawnNames = data.participants.filter(name => data.results[name]);
            label.textContent = `(${drawnNames.length}人)`;
            if (drawnNames.length === 0) {
                empty.style.display = 'block';
                wrap.innerHTML = '';
                return;
            }
            empty.style.display = 'none';
            let html = '';
            drawnNames.forEach(name => {
                const decision = data.results[name];
                const tagClass = decision === 'go' ? 'go' : 'no';
                const labelText = decision === 'go' ? '🎯 去' : '🚫 不去';
                html += `<div class="result-item"><span class="name">${escapeHtml(name)}</span><span class="tag ${tagClass}">${labelText}</span></div>`;
            });
            wrap.innerHTML = html;
        }

        function renderNameTags() {
            const container = document.getElementById('nameTagList');
            const label = document.getElementById('manageCountLabel');
            const num = document.getElementById('manageCountNum');
            label.textContent = `(${data.participants.length}/${MAX_PEOPLE})`;
            num.textContent = data.participants.length;
            if (data.participants.length === 0) {
                container.innerHTML =
                    `<div style="color:#9ca3af;padding:20px 0;text-align:center;width:100%;">名单为空，请添加或快速填充</div>`;
                return;
            }
            let html = '';
            data.participants.forEach(name => {
                const status = data.results[name];
                let dotClass = 'waiting';
                let dotLabel = '未抽';
                if (status === 'go') { dotClass = 'go';
                    dotLabel = '去'; } else if (status === 'no') { dotClass = 'no';
                    dotLabel = '不去'; }
                html += `<span class="name-tag"><span class="status-dot ${dotClass}"></span>${escapeHtml(name)}${status ? `<span style="font-size:11px;color:#9ca3af;margin-left:2px;">${dotLabel}</span>` : ''}<button class="del" data-name="${escapeHtml(name)}" title="移除">✕</button></span>`;
            });
            container.innerHTML = html;
            container.querySelectorAll('.del').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const name = this.getAttribute('data-name');
                    removeParticipant(name);
                });
            });
        }

        function renderOverview() {
            const total = data.participants.length;
            const drawn = getDrawnCount();
            const go = getGoCount();
            const no = getNoCount();
            const remain = total - drawn;
            document.getElementById('overviewTotal').textContent = total;
            document.getElementById('overviewDrawn').textContent = drawn;
            document.getElementById('overviewGo').textContent = go;
            document.getElementById('overviewNo').textContent = no;
            document.getElementById('overviewRemain').textContent = remain;
            const activeFilter = document.querySelector('.filter-btn.active');
            const filter = activeFilter ? activeFilter.dataset.filter : 'all';
            renderOverviewList(filter);
        }

        function renderOverviewList(filter) {
            const container = document.getElementById('overviewList');
            let list = data.participants.map(name => ({ name, decision: data.results[name] || null }));
            if (filter === 'go') list = list.filter(item => item.decision === 'go');
            else if (filter === 'no') list = list.filter(item => item.decision === 'no');
            else if (filter === 'waiting') list = list.filter(item => !item.decision);
            if (list.length === 0) {
                container.innerHTML = `<div style="color:#9ca3af;padding:30px 0;text-align:center;">暂无符合条件的记录</div>`;
                return;
            }
            let html = '';
            list.forEach(item => {
                const name = item.name;
                const decision = item.decision;
                let tagHtml = '';
                if (decision === 'go') tagHtml = `<span class="tag go">🎯 去</span>`;
                else if (decision === 'no') tagHtml = `<span class="tag no">🚫 不去</span>`;
                else tagHtml = `<span class="tag waiting">⏳ 未抽</span>`;
                html += `<div class="result-item"><span class="name">${escapeHtml(name)}</span>${tagHtml}</div>`;
            });
            container.innerHTML = html;
        }

        function renderDrawInfo() {
            const total = data.participants.length;
            const drawn = getDrawnCount();
            const remain = total - drawn;
            document.getElementById('listCountDisplay').textContent = total;
            document.getElementById('drawnCountDisplay').textContent = drawn;
            document.getElementById('remainCountDisplay').textContent = Math.max(0, remain);
        }

        function updateButtons() {
            const drawBtn = document.getElementById('drawBtn');
            if (data.participants.length === 0) {
                drawBtn.disabled = true;
                drawBtn.textContent = '⚠️ 名单为空';
                return;
            }
            if (isAllDrawn()) {
                drawBtn.disabled = true;
                drawBtn.textContent = '✅ 所有人已抽完';
                return;
            }
            if (isFull()) {
                drawBtn.disabled = false;
                drawBtn.textContent = '🎯 名额已满 (只能抽不去)';
                return;
            }
            drawBtn.disabled = false;
            drawBtn.textContent = '🎲 抽签';
        }

        // ============================================================
        //  ACTIONS (调用 saveToFirebase 代替 saveData)
        // ============================================================
        function addParticipant(name) {
            name = name.trim();
            if (!name) { showManageMessage('请输入姓名', 'warning'); return false; }
            if (data.participants.includes(name)) { showManageMessage(`「${name}」已在名单中`, 'warning'); return false; }
            if (data.participants.length >= MAX_PEOPLE) { showManageMessage(`最多只能录入 ${MAX_PEOPLE} 人`, 'error'); return false; }
            data.participants.push(name);
            saveToFirebase();
            renderAll();
            showManageMessage(`✅ 已添加「${name}」`, 'success');
            document.getElementById('addNameInput').value = '';
            return true;
        }

        function removeParticipant(name) {
            if (!data.participants.includes(name)) return;
            data.participants = data.participants.filter(n => n !== name);
            delete data.results[name];
            saveToFirebase();
            renderAll();
            showToast(`已移除「${name}」`);
        }

        function quickFill() {
            if (data.participants.length > 0) {
                if (!confirm('当前名单不为空，填充将覆盖现有数据，确认吗？')) return;
            }
            const demo = ['张伟', '李娜', '王芳', '刘洋', '陈静', '杨帆', '赵敏', '黄海', '周洁', '吴强', '徐丽', '孙阳', '马丁', '朱婷',
                '胡军', '郭靖', '林黛', '何云', '高远', '罗浩', '郑爽', '梁宇', '谢安', '韩冰', '唐欣'
            ];
            data.participants = demo.slice(0, MAX_PEOPLE);
            data.results = {};
            saveToFirebase();
            renderAll();
            showToast('✅ 已填充 25 人示例名单');
            showManageMessage('已填充 25 人示例名单', 'success');
        }

        function clearAll() {
            if (data.participants.length === 0) { showManageMessage('名单已为空', 'info'); return; }
            if (!confirm('确定要清空所有名单吗？此操作不可撤销！')) return;
            data.participants = [];
            data.results = {};
            saveToFirebase();
            renderAll();
            showToast('已清空所有名单');
            showManageMessage('已清空所有名单', 'info');
        }

        function performDraw() {
            const input = document.getElementById('drawInput');
            const name = input.value.trim();
            if (!name) { showDrawMessage('请输入你的名字', 'warning'); return; }
            if (!data.participants.includes(name)) { showDrawMessage(`「${name}」不在名单中，请确认`, 'error'); return; }
            if (data.results[name]) {
                const decision = data.results[name];
                showDrawResult(name, decision, true);
                showDrawMessage(`你已抽过签，结果为：${decision === 'go' ? '🎯 去' : '🚫 不去'}`, 'info');
                return;
            }
            if (isAllDrawn()) { showDrawMessage('所有人已抽完，没有剩余名额', 'warning'); return; }
            const decision = drawDecision(name);
            data.results[name] = decision;
            saveToFirebase();
            showDrawResult(name, decision, false);
            const msg = decision === 'go' ? '🎉 恭喜！你被抽中参加互动！' : '😅 很遗憾，这次没有抽中';
            showDrawMessage(msg, decision === 'go' ? 'success' : 'info');
            if (decision === 'go' && getGoCount() >= TOTAL_SLOTS) {
                launchConfetti();
            }
            renderAll();
            input.value = '';
            input.focus();
        }

        function showDrawResult(name, decision, isRepeat) {
            const box = document.getElementById('resultBox');
            const label = decision === 'go' ? '🎯 去' : '🚫 不去';
            const cls = decision === 'go' ? 'go' : 'no';
            const subText = decision === 'go' ? `恭喜！已去 ${getGoCount()}/${TOTAL_SLOTS} 人` :
                `已去 ${getGoCount()}/${TOTAL_SLOTS} 人，继续加油`;
            box.classList.add('has-result');
            box.innerHTML =
                `<div class="result-name">${escapeHtml(name)}</div><div class="result-decision ${cls}">${label}</div><div class="result-sub">${subText}</div>${isRepeat ? '<div style="margin-top:6px;font-size:13px;color:#9ca3af;">📌 已抽过签，结果不变</div>' : ''}`;
            box.querySelector('.result-decision')?.classList.add('celebrate');
        }

        // ============================================================
        //  UI HELPERS
        // ============================================================
        function showDrawMessage(text, type = 'info') {
            const el = document.getElementById('drawMessage');
            el.textContent = text;
            el.className = `message show ${type}`;
        }

        function showManageMessage(text, type = 'info') {
            const el = document.getElementById('manageMessage');
            el.textContent = text;
            el.className = `message show ${type}`;
            setTimeout(() => { el.className = 'message'; }, 3000);
        }

        let toastTimer = null;

        function showToast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  CONFETTI
        // ============================================================
        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#f472b6', '#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#fb923c', '#f87171'];
            for (let i = 0; i < 60; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const size = 6 + Math.random() * 8;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.animationDuration = 1.2 + Math.random() * 1.8 + 's';
                el.style.animationDelay = Math.random() * 0.8 + 's';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        function initEvents() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    const target = document.getElementById('tab' + this.dataset.tab.charAt(0).toUpperCase() + this
                        .dataset.tab.slice(1));
                    if (target) target.classList.add('active');
                    if (this.dataset.tab === 'results') renderOverview();
                });
            });
            document.getElementById('drawBtn').addEventListener('click', performDraw);
            document.getElementById('drawInput').addEventListener('keydown', function(e) { if (e.key === 'Enter')
                    performDraw(); });
            document.getElementById('addNameBtn').addEventListener('click', function() {
                const input = document.getElementById('addNameInput');
                addParticipant(input.value);
            });
            document.getElementById('addNameInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('addNameBtn').click();
            });
            document.getElementById('quickFillBtn').addEventListener('click', quickFill);
            document.getElementById('clearAllBtn').addEventListener('click', clearAll);
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderOverviewList(this.dataset.filter);
                });
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        // 先尝试从本地加载，但会被 Firebase 覆盖
        loadLocalData();
        renderAll(); // 立即展示本地数据（如果有）
        initEvents();
        document.getElementById('drawInput').focus();

        console.log('🎯 活动抽签工具 (云同步版) 已启动');
        console.log('等待 Firebase 数据同步...');
    </script>
</body>
</html>
